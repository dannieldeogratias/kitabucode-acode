name: KitabuCode APK
on:
  push:
    branches: [codex/acode-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Cache prepared runtimes
        id: runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: src/plugins/proot/assets/alpine_assets/
          key: offline-v1-${{ hashFiles('scripts/bundle-offline-runtimes.sh', 'src/plugins/proot/assets/alpine_assets/**') }}
      - name: Enable ARM runtime preparation
        if: steps.runtimes.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3
      - name: Bundle offline runtimes
        if: steps.runtimes.outputs.cache-hit != 'true'
        run: bash scripts/bundle-offline-runtimes.sh
      - name: Set up project
        run: |
          npm ci --no-audit --no-fund
          export PATH="$PWD/node_modules/.bin:$PATH"
          npm run setup
      - name: Build KitabuCode
        run: npm run build paid dev apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: KitabuCode-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
